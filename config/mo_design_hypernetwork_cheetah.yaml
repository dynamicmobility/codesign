# Training config for the `mo_design_hypernetwork` algorithm on CodesignCheetah.
#
# H_\pi(d, w) = \pi(a | s)
#
# Multi-objective: the per-objective reward vector is scalarized by the tradeoff w in the
# loss (as in MORLAX). Each epoch trains a grid of `num_designs` designs x `num_tradeoffs`
# tradeoffs, with `num_envs / (num_designs * num_tradeoffs)` envs per cell.
name: long-training
save_dir: scratch/logs/codesign/results/mo-design-hypernetwork-cheetah
description: "Multi-objective design-conditioned hypernetwork PPO over CodesignCheetah back-leg lengths."
algorithm: "mo_design_hypernetwork"
env: "CodesignCheetah"
backend: jnp # always jnp for training

env_config:
  ctrl_dt: 0.01
  sim_dt: 0.01
  action_scale: 1.0
  history_length: 5
  ideal_base_height: 0.5
  ideal_base_vel: 0.5
  min_base_height: 0.3
  add_random_joint_state: False
  add_random_pitch: False
  codesign:
    enabled: true
    strategy: random # design sampling strategy per training epoch
  reward:
    weights:
      run:        1.0
      height:     10.0
      energy:     0.00003
      alive:      1.0
      done:       0
    sigmas:
      height:     0.01
      speed:      0.01
      energy:     0.1
      imitation:  0.03
    optimization:
      objectives:        [['run'], ['energy'], ['height']]
      shared_objectives: ['alive']
      labels:            ['Running Speed', 'Height']
  termination:
    enabled: true
    base_height: 0.2

learning_params:
  ppo_params:
    num_timesteps: 5000000000
    episode_length: 500
    num_envs: 1024
    unroll_length: 20
    batch_size: 128
    num_minibatches: 8
    num_updates_per_batch: 4
    learning_rate: 0.0001
    entropy_cost: 0.01
    discounting: 0.98
    reward_scaling: 1.0
    clipping_epsilon: 0.2
    gae_lambda: 0.95
    max_grad_norm: 1.0
    normalize_advantage: true
    normalize_observations: true
    num_evals: 15
    num_eval_envs: 256
    deterministic_eval: true
    seed: 0
  network_params:
    hypersize: [256, 256]
    num_features: 32
    policy_hidden_layer_sizes: [64, 64]
    value_hidden_layer_sizes:  [64, 64]
  design_params:
    num_designs: 8 # designs sampled per epoch
    design_low: 0.5
    design_high: 2.0
    design_dim: 1
  tradeoff_params:
    num_tradeoffs: 8
    alpha: 1.0
    sampling: sparse-heavytail # dense | sparse-heavytail | single-avg
    warmup_frac: 0.0 # fraction of epochs training only the uniform tradeoff
