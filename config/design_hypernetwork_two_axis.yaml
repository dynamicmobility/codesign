# Training config for the `design_hypernetwork` algorithm on MAICheetah.
#
# H_\pi(d) = \pi(a | s)
#
# This is a 'single objective model', so reward scalarization is required.
name: so-speed-reward
save_dir: results/two-axis
description: "Design-conditioned hypernetwork PPO over Two Axis ratio"
algorithm: "ppo"
env: "TwoAxis"
backend: jnp # always jnp for training

env_config:
  ctrl_dt: 0.01
  sim_dt: 0.01
  action_scale: 10.0
  history_length: 5
  ideal_base_height: 0.5
  ideal_base_vel: 0.5
  min_base_height: 0.3
  add_random_joint_state: False
  add_random_pitch: False
  codesign:
    enabled: true
    strategy: random # design sampling strategy per training epoch
  reward:
    weights:
      x_track:     1.0
      y_track:     1.0
      force:       1.0
    sigmas:
      x_track:     5.0
      y_track:     5.0
      force:       10.0
    optimization:
      objectives:        [['x_track'], ['y_track']]
      shared_objectives: []
      labels:            ['Track X', 'Track Y']
  termination:
    enabled: False

learning_params:
  reward_objective_weights: [0.5, 0.5]
  ppo_params:
    num_timesteps: 50000000
    episode_length: 500
    num_envs: 128
    unroll_length: 20
    batch_size: 64
    num_minibatches: 2
    num_updates_per_batch: 4
    learning_rate: 0.0005
    entropy_cost: 0.01
    discounting: 0.98
    reward_scaling: 1.0
    clipping_epsilon: 0.1
    gae_lambda: 0.95
    max_grad_norm: 1.0
    normalize_advantage: true
    normalize_observations: true
    num_evals: 15
    num_eval_envs: 64
    deterministic_eval: true
    seed: 0
  network_params:
    policy_hidden_layer_sizes: [64, 64]
    value_hidden_layer_sizes:  [64, 64] 
  design_hypernetwork_params:
      hypersize: [128, 128]
      num_features: 16
      policy_hidden_layer_sizes: [64, 64]
      value_hidden_layer_sizes:  [64, 64]
  design_params:
    design_low: 0.01
    design_high: 0.99
    design_dim: 1
