# Training config for the `mo_design_hypernetwork` algorithm on CodesignCheetah.
#
# H_\pi(d, w) = \pi(a | s)
name: trying-with-design-pareto-prog-2
save_dir: results/Aug29
description: "Multi-objective design-conditioned hypernetwork PPO over CodesignCheetah back-leg lengths."
algorithm: "mo_design_hypernetwork"
env: "MOCodesignCheetah1D"
backend: jnp # always jnp for training

env_config:
  ctrl_dt: 0.01
  sim_dt: 0.01
  action_scale: 1.0
  reward:
    weights:
      run:        1.0
      height:     10.0
      energy:     0.00003
      alive:      1.0
      done:       0
    optimization:
      objectives:        [['run'], ['energy'], ['height']]
      shared_objectives: ['alive']
      labels:            ['Running Speed', 'Height']
      default_scalarization: [1.0, 1.0, 1.0]
      reference_point:       [0.0, 0.0, 0.0]
  termination:
    enabled: true
    base_height: 0.2
  codesign:
    default_design: [1.0]
    low:  [0.5]
    high: [2.0]

learning_params:
  ppo_params:
    num_timesteps: 500000000
    episode_length: 500
    num_envs: 8192
    unroll_length: 26
    batch_size: 256
    num_minibatches: 32
    num_updates_per_batch: 4
    learning_rate: 0.00007382460273218768
    entropy_cost: 0.023
    discounting: 0.99
    reward_scaling: 0.005333732736851479
    clipping_epsilon: 0.28
    gae_lambda: 0.95
    max_grad_norm: 1.0
    normalize_advantage: true
    normalize_observations: true
    num_evals: 15
    num_eval_envs: 1024
    deterministic_eval: true
    seed: 0
  network_params:
    hypersize: [256, 256]
    num_features: 16
    policy_hidden_layer_sizes: [64, 64]
    value_hidden_layer_sizes:  [64, 64]
  design_sampling:
    num_designs: 8 
    resamples_per_epoch: 8
    num_eval_designs: 16
  tradeoff_sampling:
    num_tradeoffs: 16
    alpha: 2.0
    sampling: sparse-heavytail # dense | sparse-heavytail | single-avg
    num_eval_tradeoffs: 16