name: cheetah-6D-sweep-with-hypersize
method: bayes
metric:
  name: Cumulative Hypervolume
  goal: maximize
parameters:
  learning_rate:
    values: [5e-4, 1e-4, 5e-5, 1e-5]
  discounting:
    values: [0.98, 0.99, 0.995]
  num_envs:
    values: [8192]
  num_minibatches:
    values: [16, 32]
  rollouts_per_step:
    values: [1, 2, 4]
  clipping_epsilon:
    values: [0.1, 0.15, 0.2]
  unroll_length:
    values: [25, 30, 35, 40]
  resamples_per_epoch:
    values: [1, 4, 8, 16]
  num_tradeoffs:
    values: [8, 16]
  num_designs:
    values: [16, 32, 64]
  num_features:
    values: [32, 64, 128]
  hypersize:
    values: [[256, 256], [512, 512], [1024, 1024]]
