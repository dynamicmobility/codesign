name: cheetah-6D-sweep
method: bayes
metric:
  name: Cumulative Hypervolume
  goal: maximize
parameters:
  learning_rate:
    values: [5e-3, 1e-3, 5e-4, 1e-4]
  discounting:
    values: [0.97, 0.98, 0.99, 0.95]
  num_envs:
    values: [2048, 4096, 8192]
  num_minibatches:
    values: [16, 32, 64, 128]
  rollouts_per_step:
    values: [1, 2]
  clipping_epsilon:
    values: [0.1, 0.15, 0.2, 0.25, 0.3]
  unroll_length:
    values: [15, 20, 25, 30]
  resamples_per_epoch:
    values: [1, 4, 8, 16]
  num_tradeoffs:
    values: [8, 16, 32]
  num_designs:
    values: [8, 16, 32]
