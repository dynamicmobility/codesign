name: design-hypernetwork-sweep
method: bayes
metric:
  name: eval/episode_reward.max # score each run by its best eval, not its last
  goal: maximize
parameters:
  # Continuous and log-scaled, so the optimizer can interpolate rather than
  # treating each value as an unrelated category.
  learning_rate:
    distribution: log_uniform_values
    min: 1.0e-5
    max: 5.0e-4
  entropy_cost:
    distribution: log_uniform_values
    min: 1.0e-4
    max: 1.0e-2
  discounting:
    values: [0.97, 0.98, 0.99] # 1/(1-g) horizons of 33-100 vs episode_length 500
  clipping_epsilon:
    values: [0.1, 0.2, 0.3]
  unroll_length:
    values: [20, 30]
  num_minibatches:
    values: [16, 32]
  num_designs:
    values: [16, 32, 64]
  num_features:
    values: [32, 64, 128]
  hypersize:
    values: [[256, 256], [512, 512], [1024, 1024]]
