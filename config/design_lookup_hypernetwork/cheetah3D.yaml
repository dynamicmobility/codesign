# Training config for the `design_lookup_hypernetwork` warm-up on CodesignCheetah.
#
# M designs fixed by Sobol; one-hot features, so row i of W is design i's own policy.
name: design-lookup-warmup-3D-longer-ppo-params
save_dir: results/Sep04
description: "One-hot lookup hypernetwork warm-up over CodesignCheetah back-leg link scales."
algorithm: design_lookup_hypernetwork
env: "MOCodesignCheetahBackLegs"
backend: jnp # always jnp for training

env_config:
  ctrl_dt: 0.01
  sim_dt: 0.01
  action_scale: 1.0
  reward:
    weights:
      run:        1.0
      height:     10.0
      energy:     0.00003
      alive:      1.0
      done:       0
    optimization:
      objectives:        [['run'], ['energy'], ['height']]
      shared_objectives: ['alive']
      labels:            ['Running Speed', 'Height']
      default_scalarization: [0, 0, 1.0]
  termination:
    enabled: true
    base_height: 0.2
  codesign:
    default_design: [1.0, 1.0, 1.0]
    low:  [0.5, 0.5, 0.5]
    high: [2.0, 2.0, 2.0]

learning_params:
  ppo_params:
    num_timesteps: 10000000000
    episode_length: 500
    num_parallel_envs: 4096 # num_designs * per_cell
    unroll_length: 20
    batch_size: 128
    num_minibatches: 32 # must equal num_designs: one design per minibatch
    num_updates_per_batch: 4
    # learning_rate: 0.0000177 # 1e-4 / sqrt(num_designs); see the module docstring
    learning_rate: 0.0002 # 1e-4 / sqrt(num_designs); see the module docstring
    entropy_cost: 0.01
    discounting: 0.98
    reward_scaling: 1.0
    clipping_epsilon: 0.2
    gae_lambda: 0.95
    max_grad_norm: 1.0
    normalize_advantage: true
    normalize_observations: true
    value_loss_type: mse
    huber_delta: 1.0
    num_evals: 30
    num_eval_envs: 256 # must divide by num_designs
    deterministic_eval: true
    seed: 0
  network_params:
    policy_hidden_layer_sizes: [64, 64]
    value_hidden_layer_sizes:  [64, 64]
    weight_initializer: kaiming_uniform
    freeze_bias: true
  design_sampling:
    num_designs: 32 # designs sampled once at the start, one row of W each
