# Training config for the `mo_design_hypernetwork` algorithm on CodesignCheetah.
#
# H_\pi(d, w) = \pi(a | s)
name: updated-mo-design-1D
save_dir: results/Sep08
description: "Multi-objective design-conditioned hypernetwork PPO over CodesignCheetah back-leg lengths."
algorithm: "morlax"
env: "MOCodesignCheetah1D"
backend: jnp # always jnp for training

env_config:
  ctrl_dt: 0.01
  sim_dt: 0.01
  action_scale: 1.0
  reward:
    weights:
      run:        1.0
      height:     10.0
      energy:     0.00003
      alive:      1.0
      done:       0
    optimization:
      objectives:        [['run'], ['energy'], ['height']]
      shared_objectives: ['alive']
      labels:            ['Running Speed', 'Height']
      default_scalarization: [0.0, 0.0, 1.0]
      reference_point:       [0.0, 0.0, 0.0]
  termination:
    enabled: true
    base_height: 0.2
  codesign:
    default_design: [1.0]
    low:  [0.5]
    high: [2.0]

learning_params:
  ppo_params:
    num_timesteps: 500000000
    episode_length: 500
    num_parallel_envs: 4096
    unroll_length: 20
    batch_size: 1024
    num_minibatches: 8
    num_updates_per_batch: 4
    learning_rate: 0.000001
    entropy_cost: 0.01
    discounting: 0.98
    reward_scaling: 1.0
    clipping_epsilon: 0.2
    gae_lambda: 0.95
    max_grad_norm: 1.0
    normalize_advantage: true
    normalize_observations: true
    num_evals: 60
    num_eval_envs: 1024
    deterministic_eval: true
    seed: 0
    value_loss_type: mse
    huber_delta: 1.0
    batching_strategy: stratified  # design | shuffle | stratified
  network_params:
    hypersize: [128, 128]
    num_features: 16
    hypertype: dual
    policy_hidden_layer_sizes: [64, 64]
    value_hidden_layer_sizes:  [64, 64]
  morlax_params:
    alpha: 1.0
    k: 8
    sampling: sparse-heavytail
    warmup_frac: 0.0
    warmup_params:
      enabled: false
      policy: None   