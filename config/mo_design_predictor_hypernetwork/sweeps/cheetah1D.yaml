# Sweep over the design predictor's own knobs. Everything else is pinned in
# cheetah1D.yaml, except num_parallel_envs, which this file overrides.
name: cheetah-1D-predictor
method: bayes
metric:
  name: Mean Hypervolume.max # score each run by its best front, not its last
  goal: maximize
parameters:
  design_entropy_cost:
    distribution: log_uniform_values
    min: 1.0e-3
    max: 1.0e+0
  design_learning_rate:
    distribution: log_uniform_values
    min: 1.0e-4
    max: 3.0e-3
  resamples_per_epoch:
    distribution: int_uniform
    min: 1
    max: 16
  num_designs:
    values: [8, 16, 32, 64] # grpo group size; must divide num_parallel_envs / num_tradeoffs
  num_warmup_iters:
    distribution: int_uniform
    min: 0
    max: 4
  clipping_epsilon:
    distribution: uniform
    min: 0.1
    max: 0.3
  design_clipping_epsilon:
    distribution: uniform
    min: 0.1
    max: 0.3
  unroll_length:
    distribution: int_uniform
    min: 20
    max: 40
  num_parallel_envs:
    value: 8192 # pinned, not an axis
