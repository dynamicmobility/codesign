# Training config for the `mo_design_predictor_hypernetwork` algorithm on CodesignCheetah.
#
# f(d | w) = N(mu(w), sigma(w))  ->  H_\pi(d, w) = \pi(a | s)
name: test
save_dir: results/Aug11
description: "Multi-objective design-conditioned hypernetwork PPO over CodesignCheetah back-leg lengths, with a GRPO-trained design predictor."
algorithm: "mo_design_predictor_hypernetwork"
env: "MOCodesignCheetah1D"
backend: jnp # always jnp for training

env_config:
  ctrl_dt: 0.01
  sim_dt: 0.01
  action_scale: 1.0
  reward:
    weights:
      run:        1.0
      height:     10.0
      energy:     0.00003
      alive:      1.0
      done:       0
    optimization:
      objectives:        [['run'], ['energy'], ['height']]
      shared_objectives: ['alive']
      labels:            ['Running Speed', 'Height']
      default_scalarization: [1.0, 1.0, 1.0]
  termination:
    enabled: true
    base_height: 0.2
  codesign:
    default_design: [1.0]
    low:  [0.5]
    high: [2.0]

learning_params:
  ppo_params:
    num_timesteps: 500000000
    episode_length: 500
    num_envs: 4096
    unroll_length: 20
    batch_size: 128
    num_minibatches: 32
    num_updates_per_batch: 4
    learning_rate: 0.0001
    entropy_cost: 0.01
    discounting: 0.99
    reward_scaling: 1.0
    clipping_epsilon: 0.3
    gae_lambda: 0.95
    max_grad_norm: 1.0
    normalize_advantage: true
    normalize_observations: true
    num_evals: 15
    # Every run scores on the same grid: num_eval_tradeoffs x num_eval_designs x 4
    # episodes = 1024 envs. A multiple of every num_designs * num_tradeoffs the sweep
    # visits, so wandb_sweep's derive_eval_grid leaves this alone.
    num_eval_envs: 1024
    deterministic_eval: true
    seed: 0
  network_params:
    hypersize: [256, 256]
    num_features: 32
    policy_hidden_layer_sizes: [64, 64]
    value_hidden_layer_sizes:  [64, 64]
  design_sampling:
    num_designs: 32
    resamples_per_epoch: 4 # times the grid is resampled (and the DP gets an update) per epoch
    num_eval_designs: 16
  tradeoff_sampling:
    num_tradeoffs: 8
    alpha: 1.0
    sampling: sparse-heavytail # dense | sparse-heavytail | single-avg
    num_eval_tradeoffs: 16
  design_predictor:
    hidden_layer_sizes: [16, 16]
    design_learning_rate: 0.001
    design_entropy_cost: 0.001
    design_clipping_epsilon: 0.3 # GRPO trust region
    num_design_updates_per_batch: 4
    num_warmup_iters: 2 # sobol sampling instead of DP
