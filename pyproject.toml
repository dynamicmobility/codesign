[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codesign"
version = "0.0.0"
description = "Codesign environments and tools"
readme = "README.md"
requires-python = ">=3.12"
authors = [ { name = "Varun Madabushi", email = "vmadabushi3@gatech.edu" } ]
license = { text = "MIT" }
dependencies = [
  "numpy",
  "jax",
  "playground",
  "pandas",
  "h5py",
  "wandb",
  "opencv-python"
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
